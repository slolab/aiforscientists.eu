site_name: AI for Scientists
site_url: https://aiforscientists.eu
site_description: >-
  Recipes and skills for giving research tasks to agents.
repo_url: https://github.com/slolab/aiforscientists.eu
repo_name: slolab/aiforscientists.eu
edit_uri: edit/main/docs/

# Skill pages are reached from the Skills overview, not the nav.
not_in_nav: |
  /index.md
  /skills/*-*.md

watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search
  - tags

# Render each recipe's kicker, title, skills and related practices from its
# frontmatter, so each is spelled once.
hooks:
  - hooks/recipe_pages.py
  # Render each skill page and its copyable brief from frontmatter.
  - hooks/skill_pages.py
  # Draw the survey and quadrant charts as inline SVG.
  - hooks/figures.py
  # Emit llms.txt, llms-full.txt and per-page .md mirrors. Last, so it captures
  # the same Markdown the pages render from (recipe titles already substituted).
  - hooks/llms_txt.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

extra_css:
  - assets/css/palette.css
  - assets/css/home.css
  - assets/css/recipes.css

# Home card effects, copied unchanged from aiforscience.eu: a cursor spotlight
# and an animated dot landscape behind each card's graphic.
extra_javascript:
  - assets/js/card_spotlight.js
  - assets/js/card_landscape.js

nav:
  - Recipes:
      # Recipe labels come from each page's frontmatter `nav_title`
      # (applied by hooks/recipe_pages.py); only ordering lives here.
      # Recipe N follows point N of the Comment "Delegate what you can check".
      - "All recipes": recipes/index.md
      - recipes/01-make-materials-accessible.md
      - recipes/02-establish-guardrails.md
      - recipes/03-learn-from-peers.md
      - recipes/04-literature-as-data.md
      - recipes/05-prototype-before-assigning.md
      - recipes/06-let-checking-cost-decide.md
      - recipes/07-checkable-problems.md
      - recipes/08-pin-down-the-method.md
      - recipes/09-write-review-teach.md
      - recipes/10-automate-paperwork.md
      - "What went wrong": recipes/failures.md
  - Guide:
      - Delegate by verifiability: guide/verifiability.md
      - Where to draw the line: guide/limits.md
      - Skills: skills/index.md
      - Tags: tags.md
  - About:
      - The idea: about/concept.md
      - How recipes work: about/how-it-works.md
      - Contribute: about/contribute.md
      - Editors and review: about/editors.md
      - Code of conduct: about/code-of-conduct.md

extra:
  # giscus comment threads under each recipe (overrides/partials/comments.html).
  # Empty ids switch the threads off. Fill them in from https://giscus.app once
  # Discussions are enabled on the repository and the category exists.
  giscus:
    repo: slolab/aiforscientists.eu
    repo_id: R_kgDOUrd0KQ
    category: Recipe comments
    category_id: ""

copyright: >-
  © 2026 AI for Scientists contributors. Content licensed
  <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY-4.0</a>.
