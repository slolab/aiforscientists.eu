site_name: AI for Scientists
site_url: https://aiforscientists.eu
site_description: >-
  Recipes and skills for giving research tasks to agents.

# Demo build: plain .html URLs so the built site also opens from disk.
use_directory_urls: false

not_in_nav: |
  /index.md

watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - tags

# Render each recipe's kicker, title, skills and related practices from its
# frontmatter, so each is spelled once.
hooks:
  - hooks/recipe_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

extra_css:
  - assets/css/palette.css
  - assets/css/home.css
  - assets/css/recipes.css

nav:
  - Recipes:
      # Recipe labels come from each page's frontmatter `nav_title`
      # (applied by hooks/recipe_pages.py); only ordering lives here.
      - recipes/01-search-for-methods.md
      - recipes/02-run-experiments-on-fixed-code.md
      - recipes/03-test-projects-before-assigning.md
      - recipes/04-extract-and-query-literature.md
      - recipes/05-project-documents-as-text.md
      - recipes/06-schedule-lab-tasks.md
      - recipes/07-fill-in-admin-forms.md
      - recipes/08-writing-reviewing-teaching.md
      - recipes/09-review-methods-restrict-files.md
      - recipes/10-pairing-and-shared-skills.md
      - "What went wrong": recipes/failures.md
  - Guide:
      - Delegate by verifiability: guide/verifiability.md
      - Where to draw the line: guide/limits.md
      - Skills: skills.md
      - Tags: tags.md
  - About:
      - The idea: about/concept.md
      - How recipes work: about/how-it-works.md
      - Contribute: about/contribute.md

copyright: >-
  Demo build. © 2026 AI for Scientists contributors. Content licensed
  <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY-4.0</a>.
